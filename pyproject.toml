[project]
name = "labs-studio"
version = "0.1.0"
description = "Desktop app for batch AI image and video generation via official provider APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "openpyxl>=3.1", "Pillow>=10", "httpx>=0.27", "keyring>=25"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
