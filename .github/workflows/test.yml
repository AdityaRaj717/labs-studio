name: test
on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/google-flow/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Node suite (offline)
        working-directory: mcp/google-flow
        run: |
          npm ci
          npm test
      - name: Python suite (offline)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest
